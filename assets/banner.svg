<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Samhita, builder at Edit Theory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#0b1511"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CF2B0"/>
      <stop offset="1" stop-color="#2FD08A"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1a2e24"/>
    </pattern>
    <style>
      .f{font-family:'SF Mono',Menlo,Consolas,'Segoe UI',monospace}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .rise{animation:r 1.2s ease-out both}
      @keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <circle cx="1010" cy="170" r="190" fill="#5CF2B0" opacity="0.04"/>

  <!-- terminal chrome -->
  <g transform="translate(60,48)">
    <circle cx="8" cy="8" r="6" fill="#2a4a3b"/><circle cx="30" cy="8" r="6" fill="#2a4a3b"/><circle cx="52" cy="8" r="6" fill="#5CF2B0"/>
  </g>

  <g class="rise">
    <text x="60" y="130" class="f" font-size="20" fill="#5CF2B0">$ whoami</text>
    <text x="60" y="200" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#F2F7F4">Samhita</text>
    <text x="335" y="200" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#mint)">/ Edit Theory</text>
    <text x="60" y="252" class="f" font-size="22" fill="#8FA89C">AI automation for D2C brands and local businesses</text>
    <text x="60" y="292" class="f" font-size="18" fill="#5CF2B0">sudo make ideas real</text>
    <rect class="blink" x="284" y="276" width="11" height="22" fill="#5CF2B0"/>
  </g>

  <!-- node motif -->
  <g transform="translate(900,90)" fill="none" stroke="#5CF2B0" stroke-width="2" opacity="0.85">
    <circle cx="20" cy="40" r="14"/><circle cx="120" cy="10" r="14"/><circle cx="120" cy="100" r="14"/><circle cx="220" cy="55" r="14" fill="#5CF2B0" fill-opacity="0.15"/>
    <path d="M34 36L106 14M34 46L106 94M134 14L206 48M134 96L206 62" stroke-opacity="0.6"/>
  </g>
</svg>
