<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Samhita builds systems that ship."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C151E"/><stop offset="1" stop-color="#34090f"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#F5DABF" fill-opacity=".09"/></pattern>
<clipPath id="panelclip"><polygon points="840,0 1200,0 1200,340 768,340"/></clipPath><style>
.k{font-family:'SF Mono',Menlo,Consolas,monospace;fill:#F5DABF;opacity:.75;letter-spacing:4px}
.t{font-family:Georgia,'Times New Roman',serif;fill:#F5DABF;font-weight:700}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#d4b49b}
.rise{animation:r 1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
@keyframes r{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:6 8;animation:f 2.2s linear infinite}
@keyframes f{to{stroke-dashoffset:-28}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 3.2s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.14);opacity:1}}
.blink{animation:b 1.2s steps(1) infinite}@keyframes b{50%{opacity:0}}
.drift{animation:dr 14s ease-in-out infinite alternate}@keyframes dr{to{transform:translate(-14px,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#dots)"/><g clip-path="url(#panelclip)"><rect width="1200" height="340" fill="#0F3D3A"/><rect width="1200" height="340" fill="url(#dots)" opacity=".7"/></g><polygon points="840,0 843,0 771,340 768,340" fill="#F5DABF" opacity=".5"/><g class="drift"><g transform="translate(882.0,110.0) scale(0.8)" fill="none" stroke="#F5DABF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="70" r="15" fill="none" stroke="#F5DABF" stroke-width="2.2"/><circle cx="130" cy="15" r="15" fill="none" stroke="#F5DABF" stroke-width="2.2"/><circle cx="130" cy="125" r="15" fill="none" stroke="#F5DABF" stroke-width="2.2"/><circle cx="250" cy="70" r="17" fill="#F5DABF" fill-opacity=".18" stroke="#F5DABF" stroke-width="2.2" class="pulse"/><path class="flow" d="M34 64L116 21M34 76L116 119M144 22L234 64M144 118L234 76" stroke-opacity=".65"/></g></g><text x="64" y="75" class="k rise" font-size="15">EDIT THEORY  ·  AI AUTOMATION</text><text x="64" y="151" class="t rise d1" font-size="62">Samhita</text><text x="64" y="209" class="t rise d2" font-size="62" font-style="italic" font-weight="400">builds systems that ship.</text><text x="64" y="257" class="s rise d3" font-size="21">AI automation for D2C brands and local businesses</text><rect class="blink" x="64" y="279" width="12" height="22" fill="#F5DABF"/></svg>