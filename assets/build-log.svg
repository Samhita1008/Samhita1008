<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Build log: eight systems">
  <defs>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#F5DABF}
      .s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#d4b49b;font-size:13px}
      .n{font-family:'SF Mono',Menlo,Consolas,monospace;fill:#F5DABF;font-size:13px;letter-spacing:2px}
      .c{fill:#4a0e15;stroke:#8c3a44;stroke-width:1.5}
      .hot{fill:#0F3D3A;stroke:#F5DABF;stroke-width:1.5}
      .chip{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      g[transform]{animation:up .8s ease-out both}
      g[transform]:nth-of-type(2){animation-delay:.1s}g[transform]:nth-of-type(3){animation-delay:.2s}g[transform]:nth-of-type(4){animation-delay:.3s}g[transform]:nth-of-type(5){animation-delay:.4s}g[transform]:nth-of-type(6){animation-delay:.5s}g[transform]:nth-of-type(7){animation-delay:.6s}g[transform]:nth-of-type(8){animation-delay:.7s}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="780" rx="16" fill="#2b0a0e"/>
  <text x="40" y="50" class="n">THE BUILD LOG</text>
  <text x="40" y="82" class="t" font-size="22" font-weight="700">Eight systems. Each one documents what broke.</text>

  <!-- row 1 -->
  <g transform="translate(40,110)">
    <rect width="270" height="200" rx="12" class="c"/>
    <text x="20" y="34" class="n">01</text>
    <text x="20" y="66" class="t" font-size="18" font-weight="700">Content Repurposing</text>
    <text x="20" y="92" class="s">One YouTube video in, ten</text>
    <text x="20" y="110" class="s">content assets out, into Notion.</text>
    <rect x="20" y="156" width="74" height="26" rx="13" fill="#F5DABF" fill-opacity="0.15"/>
    <text x="57" y="173" text-anchor="middle" class="chip" fill="#F5DABF">Working</text>
  </g>
  <g transform="translate(330,110)">
    <rect width="270" height="200" rx="12" class="c"/>
    <text x="20" y="34" class="n">02</text>
    <text x="20" y="66" class="t" font-size="18" font-weight="700">AI Outreach</text>
    <text x="20" y="92" class="s">Personalized cold email, timed</text>
    <text x="20" y="110" class="s">follow-ups, reply tracking.</text>
    <rect x="20" y="156" width="74" height="26" rx="13" fill="#F5DABF" fill-opacity="0.15"/>
    <text x="57" y="173" text-anchor="middle" class="chip" fill="#F5DABF">Working</text>
  </g>
  <g transform="translate(620,110)">
    <rect width="270" height="200" rx="12" class="c"/>
    <text x="20" y="34" class="n">03</text>
    <text x="20" y="66" class="t" font-size="18" font-weight="700">Lead Discovery</text>
    <text x="20" y="92" class="s">Finds, scores and drafts outreach</text>
    <text x="20" y="110" class="s">for Instagram leads in a niche.</text>
    <rect x="20" y="156" width="74" height="26" rx="13" fill="#F5DABF" fill-opacity="0.15"/>
    <text x="57" y="173" text-anchor="middle" class="chip" fill="#F5DABF">Working</text>
  </g>
  <g transform="translate(910,110)">
    <rect width="250" height="200" rx="12" class="c"/>
    <text x="20" y="34" class="n">04</text>
    <text x="20" y="66" class="t" font-size="18" font-weight="700">Restaurant Outreach</text>
    <text x="20" y="92" class="s">Audits a website, pitches what</text>
    <text x="20" y="110" class="s">is wrong. Human approves all.</text>
    <rect x="20" y="156" width="74" height="26" rx="13" fill="#F5DABF" fill-opacity="0.15"/>
    <text x="57" y="173" text-anchor="middle" class="chip" fill="#F5DABF">Working</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(40,330)">
    <rect width="270" height="200" rx="12" class="c"/>
    <text x="20" y="34" class="n">05</text>
    <text x="20" y="66" class="t" font-size="18" font-weight="700">Email Digest</text>
    <text x="20" y="92" class="s">Inbox sorted by urgency, one</text>
    <text x="20" y="110" class="s">summary on Telegram at 7am.</text>
    <rect x="20" y="156" width="74" height="26" rx="13" fill="#F5DABF" fill-opacity="0.15"/>
    <text x="57" y="173" text-anchor="middle" class="chip" fill="#F5DABF">Working</text>
  </g>
  <g transform="translate(330,330)">
    <rect width="400" height="200" rx="12" class="hot"/>
    <text x="20" y="34" class="n">06 · FLAGSHIP</text>
    <text x="20" y="68" class="t" font-size="22" font-weight="700">Edit Theory Concierge</text>
    <text x="20" y="96" class="s">A customer-facing booking assistant for restaurants,</text>
    <text x="20" y="114" class="s">gyms, salons and travel agencies. React frontend,</text>
    <text x="20" y="132" class="s">n8n backend, live status polling.</text>
    <rect x="20" y="156" width="96" height="26" rx="13" fill="#E8B070" fill-opacity="0.15"/>
    <text x="68" y="173" text-anchor="middle" class="chip" fill="#E8B070">Demo mode</text>
  </g>
  <g transform="translate(750,330)">
    <rect width="410" height="200" rx="12" class="hot"/>
    <text x="20" y="34" class="n">07 · NEW</text>
    <text x="20" y="68" class="t" font-size="22" font-weight="700">RWA Complaint and Vendor Agent</text>
    <text x="20" y="96" class="s">Complaints, vendor dispatch, resolution tracking and</text>
    <text x="20" y="114" class="s">notices for an apartment society, over Telegram,</text>
    <text x="20" y="132" class="s">with the secretary approving every send.</text>
    <rect x="20" y="156" width="136" height="26" rx="13" fill="#E8B070" fill-opacity="0.15"/>
    <text x="88" y="173" text-anchor="middle" class="chip" fill="#E8B070">Built, not piloted</text>
  </g>

  <g transform="translate(40,550)">
    <rect width="1120" height="130" rx="12" class="c"/>
    <text x="20" y="34" class="n">08 · LATEST</text>
    <text x="20" y="68" class="t" font-size="22" font-weight="700">Contract Redlining and Legal Risk Review</text>
    <text x="20" y="96" class="s">Reviews a contract clause by clause against a playbook, scores the risk, and routes it to counsel for approval.</text>
        <rect x="900" y="46" width="200" height="26" rx="13" fill="#E8B070" fill-opacity="0.15"/>
    <text x="1000" y="63" text-anchor="middle" class="chip" fill="#E8B070">Built, not yet run live</text>
  </g>

  <text x="40" y="720" class="s">Status labels are literal. Demo mode and not-piloted mean exactly that, and each repo README says what is simulated.</text>
  <text x="40" y="744" class="s">Stack across all of them: n8n, Groq, Google Sheets, Telegram, Gmail, Notion, Apify.</text>
</svg>
